services:

  nginx:
    image: nginx:stable
    container_name: nginx-proxy-v2

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./logs:/var/log/nginx

    restart: unless-stopped