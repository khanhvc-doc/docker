
services: #Mỗi service ≈ 1 container
  nginx:
    image: nginx:stable-perl
    container_name: nginx-proxy
    ports:
      - "8076:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro #Read-Only (Container Chỉ đọc)
    depends_on:
      - api
  api:
    build: .
    container_name: hello-api #Đặt tên container cố định
    env_file:
      - .env
    # ports:
    #   - "8073:3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: hello-mongo #Đặt tên container cố định
    env_file:
      - .env
    # ports:
    #   - "27018:27017"
    volumes:
      - mongo_data:/data/db
  
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-ui
    ports:
      - "8074:8081"
    env_file:
      - .env
    environment:
      # 🔐 Login UI
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo


volumes:
  mongo_data:
